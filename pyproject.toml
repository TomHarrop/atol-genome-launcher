[build-system]
requires = ["setuptools>=42", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "atol-genome-launcher"
dynamic = ["version"]
description = "Draft code for the AToL genome launcher"
readme = "README.md"
authors = [
    { name = "Amy Tims", email = "amy.tims@unimelb.edu.au" },
    { name = "Emily Marshall", email = "emily@biocommons.org.au" },
    { name = "Keeva Connolly", email = "keeva.connolly@qcif.edu.au" },
    { name = "Tom Harrop", email = "tharrop@unimelb.edu.au" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "argparse",
    "pandas>=2.3.3,<3",
    "pydantic>=2.13.4",
    "snakedeploy>=0.11.0",
    "snakemake>=9.11.6,<10",
    "atol-data-broker@git+https://github.com/AToL-Bioinformatics/data-broker.git@0.1.2",
]

[project.urls]
"Homepage" = "https://github.com/tomharrop/atol-genome-launcher"

[project.scripts]
assembly-data-downloader = "assembly_data_downloader.assembly_data_downloader:main"
bpa-file-downloader = "bpa_file_downloader.bpa_file_downloader:main"
deploy-pipeline = "deploy_pipeline.deploy_pipeline:main"
generate-ena-assembly-manifest = "generate_ena_assembly_manifest.generate_ena_assembly_manifest:main"
pipeline-config-generator = "pipeline_config_generator.pipeline_config_generator:main"
pipeline-result-uploader = "pipeline_result_uploader.pipeline_result_uploader:main"
report-pipeline-result-to-canopy = "report_pipeline_result_to_canopy.report_pipeline_result_to_canopy:main"
request-assembly-repo = "request_assembly_repo.request_assembly_repo:main"
result-file-uploader = "result_file_uploader.result_file_uploader:main"
rnaseq-manifest-generator = "rnaseq_manifest_generator.rnaseq_manifest_generator:main"
rnaseq-reads-downloader = "rnaseq_reads_downloader.rnaseq_reads_downloader:main"
submit-run-to-ena = "submit_run_to_ena.submit_run_to_ena:main"

[tool.setuptools.package-data]
"assembly_data_downloader" = ["workflow/Snakefile"]
"bpa_file_downloader" = ["workflow/Snakefile"]
"pipeline_config_generator" = ["templates/*.j2"]
"pipeline_result_uploader" = ["workflow/Snakefile"]
"result_file_uploader" = ["workflow/Snakefile"]
"rnaseq_reads_downloader" = ["workflow/Snakefile"]
"yaml_manifest" = ["assembly_types.json", "directory_layout.json"]

[tool.setuptools_scm]
